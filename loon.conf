# 配置片段：合并到现有配置，不要覆盖整份 Loon 配置。
# 远程链接需要仓库公开后才能匿名下载。私有仓库请使用本地文件名。
[Script]
http-request ^https:\/\/app\.geely\.com(?::443)?\/ script-path=https://raw.githubusercontent.com/Timkeltis/geely/main/geely-cookie.loon.js, requires-body=false, timeout=10, tag=吉利汽车获取Cookie
cron "5 8 * * *" script-path=https://raw.githubusercontent.com/Timkeltis/geely/main/geely.js, timeout=60, tag=吉利汽车签到

[Mitm]
# 已有其他域名时追加 app.geely.com，保留其他域名。
hostname = app.geely.com
